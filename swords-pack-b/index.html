const T_UP=.12,T_SW=.13,T_SET=.20,T_FADE=.16;   // 120 ms wind-up, 130 ms swing, 200 ms settle (trail fades in 160 ms)

function trail(r,p){
 const path=r.path;
 if(p.lead==null||p.op<=.01||RM.matches){path.setAttribute("d","");return}
 const im=r.img,w=im.offsetWidth,h=im.offsetHeight,L=im.offsetLeft-w/2,T=im.offsetTop-h/2,g=GEO[N[r.i]]||[.12,.5,.97,.45];
 const px=L+g[0]*w,py=T+g[1]*h,dx=(g[2]-g[0])*w,dy=(g[3]-g[1])*h,R=Math.hypot(dx,dy)*p.sc,a0=Math.atan2(dy,dx)*180/Math.PI;
 const A=(a0+p.tail)*Math.PI/180,B=(a0+p.lead)*Math.PI/180,n=28,o=[],ii=[];
 for(let j=0;j<=n;j++){const s=j/n,a=A+(B-A)*s,ro=R*1.015,ri=R*(1-.5*Math.pow(s,1.15));
  o.push(`${(px+ro*Math.cos(a)).toFixed(1)},${(py+ro*Math.sin(a)).toFixed(1)}`);ii.push(`${(px+ri*Math.cos(a)).toFixed(1)},${(py+ri*Math.sin(a)).toFixed(1)}`)}
 path.setAttribute("d","M"+o.join("L")+"L"+ii.reverse().join("L")+"Z");
 const gr=r.grad;gr.setAttribute("x1",(px+R*Math.cos(A)).toFixed(1));gr.setAttribute("y1",(py+R*Math.sin(A)).toFixed(1));
 gr.setAttribute("x2",(px+R*Math.cos(B)).toFixed(1));gr.setAttribute("y2",(py+R*Math.sin(B)).toFixed(1));
 path.style.opacity=p.op.toFixed(3)}
function frame(now){
 if(!run)return;const r=run;
 if(!r.ok){r.t0=now;raf=requestAnimationFrame(frame);return}   // clock starts when the picture is decoded
 if(!r.shown){r.shown=1;fit(r);r.img.classList.add("on");r.old.forEach(e=>e.remove());r.old=[]}
 const t=(now-r.t0)/1000,p=P_(t,r);
 r.img.style.transform=`translate(-50%,-50%) rotate(${p.rot.toFixed(2)}deg) scale(${p.sc.toFixed(4)})`;
 trail(r,p);
 if(!RM.matches)raf=requestAnimationFrame(frame);   // idle sway keeps running
}
function mk(box,i,m){
 let svg=box.querySelector("svg");
 if(!svg){box.insertAdjacentHTML("beforeend",`<svg xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="tg${box.id}" gradientUnits="userSpaceOnUse"></linearGradient></defs><path fill="url(#tg${box.id})"></path></svg>`);svg=box.querySelector("svg")}
 const e=document.createElement("img");e.alt="";e.draggable=false;const g=GEO[N[i]]||[.12,.5];
 e.style.transformOrigin=`${(g[0]*100).toFixed(2)}% ${(g[1]*100).toFixed(2)}%`;box.appendChild(e);                 // trail svg sits behind the sword
 return e}
function tint(svg,m){
 const cols=TINT[M[m][0]]||["#7fa8e0"],n=cols.length-1;
 svg.querySelector("linearGradient").innerHTML=n?cols.map((c,j)=>`<stop offset="${(j/n).toFixed(3)}" stop-color="${c}" stop-opacity="${(.05+.9*Math.pow(j/n,1.3)).toFixed(3)}"/>`).join("")
  :`<stop offset="0" stop-color="${cols[0]}" stop-opacity="0"/><stop offset=".55" stop-color="${cols[0]}" stop-opacity=".45"/><stop offset="1" stop-color="${cols[0]}" stop-opacity=".95"/>`}
function start(box,i,m,img,ready){
 cancelAnimationFrame(raf);
 const old=[...box.querySelectorAll("img")].filter(x=>x!==img),svg=box.querySelector("svg");
 run={pop:!!ready,wu:WU,sw:SW,img,old,path:svg.querySelector("path"),grad:svg.querySelector("linearGradient"),i,m,ok:0,shown:0,t0:performance.now(),svg};
 const r=run,src=`${D[i]}/${N[i]}_${m}.webp`;
 const done=()=>{dec(img).then(()=>{if(run===r)tint(svg,m);r.ok=1})};
 img.onload=done;img.onerror=()=>setTimeout(()=>{img.src=src+"?r="+Date.now()},500);
 if(ready){tint(svg,m);r.ok=1;r.shown=1;fit(r);img.classList.add("on");old.forEach(e=>e.remove());r.old=[];
  const p=P_(0,r);img.style.transform=`translate(-50%,-50%) rotate(${p.rot.toFixed(2)}deg) scale(${p.sc.toFixed(4)})`}   // already decoded: first pose now, no empty frame
 else if(img.getAttribute("src")!==src)img.src=src;else if(img.complete&&img.naturalWidth)done();
 raf=requestAnimationFrame(frame)}
function show(dir,same){
 const A=document.getElementById(front),B=document.getElementById(front=="ga"?"gb":"ga");
 if(same){show.req=(show.req||0)+1;start(A,ai,mi,mk(A,ai,mi))}   // colour chip / replay: the old picture stays until the new one is decoded
 else{
  const my=show.req=(show.req||0)+1,img=mk(B,ai,mi),src=`${D[ai]}/${N[ai]}_${mi}.webp`;
  [...B.querySelectorAll("img")].forEach(x=>{if(x!==img)x.remove()});
  const swap=()=>{if(my!==show.req)return;
   start(B,ai,mi,img,1);B.style.transition="none";B.style.transform=dir?`translateX(${dir*40}px)`:"none";B.classList.add("out");
   void B.offsetWidth;                            // commit the start state, then slide in (no rAF: works in throttled iframes)
   B.style.transition="";B.classList.remove("out");B.style.transform="none";A.classList.add("out");A.style.transform=dir?`translateX(${-dir*40}px)`:"none";
   clearTimeout(show.clr);show.clr=setTimeout(()=>{if(A.classList.contains("out"))A.querySelectorAll("img").forEach(x=>x.remove())},350);
   front=B.id};
  img.onload=()=>{dec(img).then(swap)};
  img.onerror=()=>setTimeout(()=>{if(my===show.req)img.src=src+"?r="+Date.now()},400);
  img.src=src;
 }
 document.getElementById("name").textContent=P[ai][2];document.getElementById("tris").textContent=P[ai][3]?P[ai][3].toLocaleString("en-US")+" triangles":"";
 document.getElementById("count").textContent=`${ai+1} / ${N.length}`;
 [...rt.children].forEach((e,i)=>e.classList.toggle("on",i==ai));
 [...mu.children].forEach((e,i)=>e.classList.toggle("on",i==mi));
 const t=rt.children[ai],W=document.getElementById("roster").clientWidth;
 const tx=t.offsetLeft+t.offsetWidth/2-W/2;loadVis(tx);rscroll(tx,show.done);show.done=1;
 [ai-1,ai+1].forEach(j=>{if(N[j]){const p=new Image();p.src=`${D[j]}/${N[j]}_${mi}.webp`}});
}
function go(i,dir){i=(i+N.length)%N.length;dir=dir||(i>ai?1:-1);ai=i;show(dir)}
document.getElementById("prev").onclick=()=>go(ai-1,-1);
document.getElementById("next").onclick=()=>go(ai+1,1);
document.getElementById("replay").onclick=()=>show(0,1);
addEventListener("keydown",e=>{if(e.key=="ArrowRight")go(ai+1,1);if(e.key=="ArrowLeft")go(ai-1,-1)});
const st=document.getElementById("stage");let tx=null,ty=null;
function swipe(dx,dy){if(Math.abs(dx)>35&&Math.abs(dx)>Math.abs(dy)){const d=dx<0?1:-1;go(ai+d,d)}}
st.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
st.addEventListener("touchend",e=>{if(tx===null)return;const t=e.changedTouches[0];swipe(t.clientX-tx,t.clientY-ty);tx=null},{passive:true});
let mx=null,my=null;
st.addEventListener("mousedown",e=>{if(e.target.closest(".nav,.replay"))return;mx=e.clientX;my=e.clientY});
addEventListener("mouseup",e=>{if(mx===null)return;swipe(e.clientX-mx,e.clientY-my);mx=null});
addEventListener("resize",()=>{if(run)fit(run)});
document.addEventListener("visibilitychange",()=>{if(document.hidden)cancelAnimationFrame(raf);else if(run){raf=requestAnimationFrame(frame)}});
/* QA hook: SLASH.seek(t) freezes the current sword at t seconds of its timeline (frame-by-frame checks); SLASH.play() resumes */
window.SLASH={seek(t){cancelAnimationFrame(raf);const r=run;if(!r)return;if(r.ok&&!r.shown){r.shown=1;fit(r);r.img.classList.add("on");r.old.forEach(e=>e.remove());r.old=[]}const p=P_(t,r);r.img.style.transform=`translate(-50%,-50%) rotate(${p.rot.toFixed(2)}deg) scale(${p.sc.toFixed(4)})`;trail(r,p);return p},
 play(){if(run){fit(run);run.t0=performance.now();raf=requestAnimationFrame(frame)}},pose,fit:()=>run&&(fit(run),[run.wu,run.sw])};
show();
</script></body></html>
